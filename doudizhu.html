<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>斗地主 · Fight the Landlord</title>
<style>
:root{
  --felt1:#0f5132; --felt2:#083d24; --felt3:#0a2e1c;
  --gold:#e8c46a; --gold2:#b8912f;
  --ink:#1b1b1b; --red:#c8102e;
  --panel:rgba(0,0,0,.34); --line:rgba(255,255,255,.14);
  --card-w:64px; --card-h:92px; --hand-ov:-30px;
  --feltGlow:#17734a; --felt0:#17734a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:"Avenir Next","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB",Arial,sans-serif;
  background:radial-gradient(ellipse at 50% 8%, var(--feltGlow) 0%, var(--felt1) 34%, var(--felt2) 66%, var(--felt3) 100%);
  color:#f2f2f2; overflow:hidden; user-select:none;
}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;position:relative}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.2);flex:0 0 auto;
}
h1{font-size:17px;margin:0;letter-spacing:.06em;color:var(--gold);font-weight:600;white-space:nowrap}
h1 small{color:#cfe6d8;font-weight:400;letter-spacing:.02em;font-size:11px;display:block;opacity:.75}
.spacer{flex:1}
.chip{
  font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel);
  border:1px solid var(--line);white-space:nowrap
}
.chip b{color:var(--gold);font-variant-numeric:tabular-nums}
button{
  font:inherit;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:#fff;
  transition:transform .08s, background .15s, opacity .15s;
}
button:hover:not(:disabled){background:rgba(255,255,255,.18)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.32;cursor:default}
button.gold{background:linear-gradient(#f0d283,var(--gold2));color:#2b1d00;border-color:#f5e2ae;font-weight:700}
button.gold:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(#f7de9c,#c79c33)}
button.ghost{font-size:12px;padding:5px 11px}
#stakepick{display:flex;align-items:center;gap:5px;cursor:pointer}
#langpick{display:flex;align-items:center;cursor:pointer}
#langpick select,
#stakepick select{
  background:transparent;border:0;color:var(--gold);font:inherit;font-size:11.5px;
  font-weight:700;cursor:pointer;outline:none;padding:0
}
#stakepick select option{background:var(--felt3);color:#fff}
#bankchip b{font-variant-numeric:tabular-nums}
.stakes,.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.stakes button,.seg button{padding:5px 12px;font-size:12px}
.stakes button.on,.seg button.on{background:linear-gradient(#f0d283,var(--gold2));color:#2b1d00;border-color:#f5e2ae;font-weight:700}
.setrow{margin:0 0 11px}
.setrow .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a9c9b6;margin-bottom:5px}
.setrow .note{font-size:11.5px;color:#8fb3a0;margin-top:5px;line-height:1.45}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:9px;border:2px solid rgba(255,255,255,.2);cursor:pointer;padding:0}
.swatch.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,106,.28)}
.bust{color:#ff9c9c;font-size:12.5px;margin-top:8px}

/* ---------- table ---------- */
#table{flex:1 1 auto;position:relative;min-height:190px}
.seat{position:absolute;top:14px;width:150px;display:flex;flex-direction:column;align-items:center;gap:6px}
.seat.left{left:8px} .seat.right{right:8px}
.avatar{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;
  background:rgba(0,0,0,.38);border:2px solid var(--line);position:relative;transition:box-shadow .2s,border-color .2s;
}
.seat.active .avatar{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,196,106,.22),0 0 18px rgba(232,196,106,.45)}
.pname{font-size:12.5px;letter-spacing:.03em}
.badge{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  font-size:9.5px;padding:2px 7px;border-radius:999px;background:linear-gradient(#f0d283,var(--gold2));
  color:#2b1d00;font-weight:800;letter-spacing:.05em;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)
}
.handcount{display:flex;align-items:center;gap:5px;font-size:12px;color:#d8ecdf}
.handcount b{color:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.backfan{display:flex;height:26px;align-items:center}
.backfan i{
  display:block;width:15px;height:22px;border-radius:3px;margin-left:-9px;
  background:repeating-linear-gradient(45deg,#a3272f 0 3px,#7d1c23 3px 6px);
  border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 2px rgba(0,0,0,.4)
}
.backfan i:first-child{margin-left:0}
.thinking{font-size:11px;color:var(--gold);height:13px;letter-spacing:.06em}

/* bottom (kitty) cards */
#kitty{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
#kitty .lbl{font-size:10.5px;letter-spacing:.14em;color:#a9c9b6;text-transform:uppercase}
#kittycards{display:flex;gap:5px}

/* the table centre: whatever was played last, with the turn status beneath it */
#centre{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;width:100%
}
#board{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:0}
#board .who{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a9c9b6;
  text-shadow:0 1px 3px rgba(0,0,0,.5)
}
#board .cards{display:flex}
#board .cards .card{margin-left:-24px}
#board .cards .card:first-child{margin-left:0}

/* a player who passed is flagged at their own seat, not in the centre */
.passtag{
  font-size:12px;font-weight:800;letter-spacing:.14em;color:#ffd9a8;
  padding:4px 12px;border-radius:7px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.3)
}
#passme{position:absolute;bottom:6px;left:50%;transform:translateX(-50%)}

#status{text-align:center;font-size:14px;color:#d9ecdf;letter-spacing:.03em;width:260px}
#status .big{font-size:20px;color:var(--gold);font-weight:700;letter-spacing:.08em}

/* ---------- cards ---------- */
.card{
  width:var(--card-w);height:var(--card-h);border-radius:7px;background:linear-gradient(#fff,#f2f0ea);
  box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.09);
  position:relative;flex:0 0 auto;color:var(--ink);overflow:hidden;
}
.card.red{color:var(--red)}
.card .corner{position:absolute;top:3px;left:4px;line-height:.98;text-align:center;font-weight:800}
.card .corner .r{display:block;font-size:16px}
.card .corner .s{display:block;font-size:12px}
.card .big{position:absolute;right:5px;bottom:2px;font-size:30px;opacity:.5;line-height:1}
.card.joker .jk{
  position:absolute;right:6px;top:16px;bottom:4px;width:16px;font-size:11px;font-weight:800;
  letter-spacing:.06em;writing-mode:vertical-rl;display:grid;place-items:center;opacity:.75
}
.card.joker .corner .r{font-size:13px}
.card.small{--card-w:44px;--card-h:63px;width:44px;height:63px;border-radius:5px}
.card.small .corner .r{font-size:12px} .card.small .corner .s{font-size:9px}
.card.small .big{font-size:20px} .card.small.joker .jk{font-size:8px;width:11px;top:13px}
.card.mini{width:34px;height:49px;border-radius:4px}
.card.mini .corner .r{font-size:10px} .card.mini .corner .s{font-size:7px}
.card.mini .big{font-size:15px} .card.mini.joker .jk{font-size:7px;width:9px;top:11px}
.card.facedown{background:repeating-linear-gradient(45deg,#a3272f 0 5px,#7d1c23 5px 10px);box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.35)}
.card.facedown *{display:none}
@keyframes dealin{from{opacity:0;transform:translateY(26px) scale(.85)}to{opacity:1;transform:none}}
#board .cards .card{animation:dealin .18s ease-out both}

/* ---------- hand ---------- */
#handwrap{flex:0 0 auto;padding:12px 10px 6px;display:flex;justify-content:center;align-items:flex-end;min-height:118px}
#hand{display:flex;justify-content:center;padding-top:20px}
#hand .card{margin-left:var(--hand-ov);cursor:pointer;transition:transform .12s ease-out,box-shadow .12s}
#hand .card:first-child{margin-left:0}
#hand .card:hover{transform:translateY(-9px)}
#hand .card.sel{transform:translateY(-22px);box-shadow:0 8px 14px rgba(0,0,0,.5),0 0 0 2px var(--gold)}
#hand.locked .card{cursor:default}
#hand.locked .card:hover{transform:none}
#hand.locked .card.sel{transform:translateY(-22px)}

/* ---------- controls ---------- */
#controls{
  flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:10px;
  padding:8px 12px 14px;min-height:56px;flex-wrap:wrap
}
#combolabel{
  position:absolute;left:50%;transform:translateX(-50%);bottom:74px;font-size:12px;letter-spacing:.05em;
  color:var(--gold);height:16px;pointer-events:none;text-shadow:0 1px 3px #000
}
#combolabel.bad{color:#ff9c9c}

/* ---------- log ---------- */
#log{
  position:absolute;right:10px;bottom:8px;width:186px;max-height:120px;overflow:hidden;
  font-size:11px;line-height:1.5;color:#bcd9c7;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;pointer-events:none;display:flex;flex-direction:column-reverse
}
#log div{opacity:.9}
#log b{color:var(--gold)}

/* ---------- modal ---------- */
.overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.72);
  display:grid;place-items:center;z-index:40;padding:20px
}
/* keep every control in a dialog above its own backdrop, whatever the browser does
   with stacking inside the panel */
.modal button,.modal .seg,.modal .stakes,.modal .swatches,.modal .row{position:relative;z-index:2}
.overlay.hidden{display:none}
.modal{
  background:linear-gradient(var(--felt1),var(--felt3));border:1px solid var(--gold2);border-radius:14px;
  padding:22px 26px;max-width:520px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.6);
  max-height:86vh;overflow:auto
}
.modal h2{margin:0 0 4px;color:var(--gold);font-size:21px;letter-spacing:.04em}
.modal .sub{font-size:12.5px;color:#a9c9b6;margin-bottom:14px}
.modal p,.modal li{font-size:13px;line-height:1.62;color:#e2f0e7}
.modal ul{padding-left:18px;margin:8px 0}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tally{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:13px}
.tally th,.tally td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:right}
.tally th:first-child,.tally td:first-child{text-align:left}
.tally td.pos{color:#7ee0a0} .tally td.neg{color:#ff9c9c}
.tally .me{color:var(--gold)}
kbd{background:rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;font-size:11px}

/* ---------- achievements ---------- */
#toasts{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none
}
.toast{
  display:flex;align-items:center;gap:11px;padding:10px 16px;border-radius:11px;
  background:linear-gradient(#1d6a47,#0d3f2a);border:1px solid var(--gold2);
  box-shadow:0 10px 28px rgba(0,0,0,.5);font-size:12.5px;line-height:1.35;color:#eaf6ee;
  animation:toastin .32s cubic-bezier(.2,1.3,.4,1) both;max-width:300px
}
.toast.out{animation:toastout .45s ease-in forwards}
.toast .ti{font-size:26px;line-height:1}
.toast b{color:var(--gold);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase}
@keyframes toastin{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-14px)}}
.achlist{list-style:none;padding:0;margin:12px 0 4px;max-height:52vh;overflow:auto}
.achlist li{
  display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:7px;border-radius:10px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);opacity:.55
}
.achlist li.got{opacity:1;border-color:var(--gold2);background:rgba(232,196,106,.10)}
.achlist .ai{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.achlist .atx{flex:1;font-size:12.5px;line-height:1.4}
.achlist .atx b{color:var(--gold);font-size:13px}
.achlist li:not(.got) .atx b{color:#cfe6d8}
.achlist .atx span{color:#a9c9b6;font-size:11.5px}
.achlist .apr{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- home screen ---------- */
#home{z-index:30}
#overlay{z-index:80}       /* a dialog outranks the home screen and the toasts */
.modal.home{max-width:560px;text-align:center}
.hero{font-size:44px;color:var(--gold);letter-spacing:.16em;font-weight:700;line-height:1.1}
.heroSub{font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;color:#a9c9b6;margin-top:6px}
.modes{display:flex;gap:12px;margin:24px 0 14px;flex-wrap:wrap}
button.mode{
  flex:1 1 200px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  padding:16px 16px 15px;text-align:left;border-radius:12px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.17);
}
button.mode:hover{background:rgba(255,255,255,.14);border-color:var(--gold2)}
button.mode .mi{font-size:26px;line-height:1}
button.mode .mt{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.02em}
button.mode .md{font-size:11.5px;color:#c3dccd;line-height:1.5;font-weight:400}
.hint{font-size:11px;color:#7fa992;margin:2px 0 10px;letter-spacing:.02em}
.homefoot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.homefoot .bankline{margin-left:auto}
.bankline{font-size:11.5px;color:#a9c9b6}
.bankline b{color:var(--gold)}
.lobby{text-align:left}
.seatlist{list-style:none;padding:0;margin:12px 0}
.seatlist li{
  display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:7px;border-radius:9px;
  background:rgba(0,0,0,.24);border:1px solid var(--line);font-size:13px
}
.seatlist .tag{margin-left:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#a9c9b6}
.seatlist .tag.here{color:#7ee0a0}
.linkbox{
  display:flex;gap:8px;align-items:center;margin:12px 0 4px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px
}
.linkbox input{
  flex:1;background:transparent;border:0;color:#e2f0e7;font:inherit;font-size:12px;outline:none;
  text-overflow:ellipsis
}
.hostnote{font-size:11.5px;color:#a9c9b6;line-height:1.6;margin-top:10px}
.hostnote code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;font-size:11px;color:#e8c46a}

@media (max-width:820px){
  header{gap:7px;padding:7px 10px}
  .chip{font-size:10.5px;padding:3px 8px}
  button{font-size:12px;padding:6px 11px}
  :root{--card-w:52px;--card-h:75px}
  .seat{width:112px}
  #log{display:none}
  h1 small{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>斗地主 <small>Fight the Landlord</small></h1>
    <div class="chip" id="bankchip">You <b>0</b> · East <b>0</b> · West <b>0</b></div>
    <label class="chip" id="stakepick"><span id="stakelbl">Stake</span> <select id="stakesel"></select></label>
    <div class="chip" id="stakechip">—</div>
    <div class="spacer"></div>
    <button class="ghost" id="btnmute" title="Music">🔊</button>
    <button class="ghost" id="btnrules">Rules</button>
    <button class="ghost" id="btnnew">New hand</button>
    <button class="ghost" id="btnexit">Exit</button>
  </header>

  <div id="table">
    <div class="seat left" id="seat2">
      <div class="avatar">🧑‍🌾<span class="badge" style="display:none"></span></div>
      <div class="pname">West</div>
      <div class="handcount"><span class="backfan"></span><b>0</b></div>
      <div class="thinking"></div>
      <div class="passtag seatpass" style="display:none">PASS</div>
    </div>
    <div class="seat right" id="seat1">
      <div class="avatar">👩‍🌾<span class="badge" style="display:none"></span></div>
      <div class="pname">East</div>
      <div class="handcount"><span class="backfan"></span><b>0</b></div>
      <div class="thinking"></div>
      <div class="passtag seatpass" style="display:none">PASS</div>
    </div>

    <div id="kitty">
      <div class="lbl">Landlord's three</div>
      <div id="kittycards"></div>
    </div>

    <div id="centre">
      <div id="board"></div>
      <div id="status"></div>
    </div>

    <div class="passtag" id="passme" style="display:none">PASS</div>

    <div id="log"></div>
  </div>

  <div id="handwrap"><div id="hand"></div></div>
  <div id="combolabel"></div>
  <div id="controls"></div>

  <div id="toasts"></div>

  <div class="overlay" id="home">
    <div class="modal home">
      <div class="hero">斗地主</div>
      <div class="heroSub">Fight the Landlord</div>
      <div class="modes">
        <button class="mode" id="modeAi">
          <span class="mi">🤖</span>
          <span class="mt">Play the bots</span>
          <span class="md">One seat for you, two for the AI. Works offline, nothing to set up.</span>
        </button>
        <button class="mode" id="modeOnline">
          <span class="mi">🔗</span>
          <span class="mt">Play with friends</span>
          <span class="md">Get a link to send round. Empty seats are filled by bots.</span>
        </button>
      </div>
      <div class="hint" id="homeHint"></div>
      <div class="homefoot">
        <button class="ghost" id="homeAch">Achievements</button>
        <button class="ghost" id="homeSettings">Settings</button>
        <button class="ghost" id="homeRules">How to play</button>
        <span class="bankline" id="homeBank"></span>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
</div>
<script>
"use strict";
/* =======================================================================
   Dou Dizhu (斗地主) — 3 player Fight the Landlord
   Rules per pagat.com: 54 cards, auction 1/2/3, 13 combination types,
   bombs/rockets double the stake, spring doubles again.
   ======================================================================= */

/* ---------------- cards ---------------- */
var R_NAME = {3:"3",4:"4",5:"5",6:"6",7:"7",8:"8",9:"9",10:"10",11:"J",12:"Q",13:"K",14:"A",15:"2",16:"小",17:"大"};
var SUIT = [{g:"♠",c:"black"},{g:"♥",c:"red"},{g:"♦",c:"red"},{g:"♣",c:"black"}];
var TYPE_NAME = {
  single:"Single", pair:"Pair", triple:"Triple", triple1:"Triple + single", triple2:"Triple + pair",
  straight:"Straight", pairseq:"Pair sequence", tripseq:"Airplane", plane1:"Airplane + singles",
  plane2:"Airplane + pairs", bomb:"💣 Bomb", rocket:"🚀 Rocket",
  quad1:"Quad + 2 singles", quad2:"Quad + 2 pairs"
};

/* ======================= languages =======================
   Every player-visible string lives here. Adding a language is one more entry —
   nothing outside this table needs to change. */
var LANGS = [
  {id:"en",   label:"English"},
  {id:"zh",   label:"简体中文"},
  {id:"zhT",  label:"繁體中文"},
  {id:"es",   label:"Español"}
];
var STR = {
en:{
  sub:"Fight the Landlord", rules:"Rules", newHand:"New hand", exit:"Exit",
  stake:"Stake", perPt:"{0}/pt", basePt:"Base <b>{0}</b>/pt",
  exposure:"{0}/pt × bid {1}{2} = <b>{3}</b> ea · you risk <b>{4}</b>",
  you:"You", east:"East", west:"West", player:"Player", bot:"Bot",
  landlordTag:"LANDLORD 地主", kitty:"Landlord's three", passTag:"PASS",
  pass:"Pass", bid:"Bid {0}", hint:"Hint", clear:"Clear", play:"Play",
  c_single:"Single", c_pair:"Pair", c_triple:"Triple", c_triple1:"Triple + single",
  c_triple2:"Triple + pair", c_straight:"Straight", c_pairseq:"Pair sequence",
  c_tripseq:"Airplane", c_plane1:"Airplane + singles", c_plane2:"Airplane + pairs",
  c_bomb:"💣 Bomb", c_rocket:"🚀 Rocket", c_quad1:"Quad + 2 singles", c_quad2:"Quad + 2 pairs",
  setSfx:"Sound effects",
  setMusic:"Music", musicOn:"On", musicOff:"Off",
  homeKeys:"Keys: 1 bots · 2 friends · A achievements · S settings",
  achievements:"Achievements", achGot:"Achievement unlocked", achCount:"{0} of {1} unlocked", achBest:"best streak {0}",

/* ---------------- combination parsing ---------------- */
function counts(cards){
  var m = new Map(), i;
  for (i = 0; i < cards.length; i++) m.set(cards[i].rank, (m.get(cards[i].rank) || 0) + 1);
  return m;
}
function consecutive(arr){
  for (var i = 1; i < arr.length; i++) if (arr[i] !== arr[i-1] + 1) return false;
  return true;
}
/* returns {type, rank, len, size} or null if the set is not a legal play */
function parseCombo(cards){
  var n = cards.length;
  if (!n) return null;
  var m = counts(cards);
  var ranks = Array.from(m.keys()).sort(function(a,b){ return a - b; });
  var by = {1:[],2:[],3:[],4:[]}, i, r, c;
  for (i = 0; i < ranks.length; i++){
    r = ranks[i]; c = m.get(r);
    if (c > 4) return null;
    by[c].push(r);
  }
  var hi = ranks[ranks.length - 1];
  var bothJokers = m.has(16) && m.has(17);

  if (n === 2 && bothJokers) return {type:"rocket", rank:100, len:1, size:2};
  if (n === 1) return {type:"single", rank:ranks[0], len:1, size:1};
  if (n === 2 && by[2].length === 1) return {type:"pair", rank:ranks[0], len:1, size:2};
  if (n === 3 && by[3].length === 1) return {type:"triple", rank:ranks[0], len:1, size:3};
  if (n === 4 && by[4].length === 1) return {type:"bomb", rank:ranks[0], len:1, size:4};
  if (n === 4 && by[3].length === 1 && by[1].length === 1) return {type:"triple1", rank:by[3][0], len:1, size:4};
  if (n === 5 && by[3].length === 1 && by[2].length === 1) return {type:"triple2", rank:by[3][0], len:1, size:5};

  /* quadplex sets — quad + two distinct singles, or quad + two distinct pairs */
  if (by[4].length === 1){
    if (n === 6 && by[1].length === 2 && !bothJokers) return {type:"quad1", rank:by[4][0], len:1, size:6};
    if (n === 8 && by[2].length === 2) return {type:"quad2", rank:by[4][0], len:1, size:8};
  }

  /* pure sequences — 3..A only, no 2s or jokers */
  if (hi <= 14 && consecutive(ranks)){
    if (n >= 5 && by[1].length === ranks.length)
      return {type:"straight", rank:hi, len:ranks.length, size:n};
    if (ranks.length >= 3 && by[2].length === ranks.length)
      return {type:"pairseq", rank:hi, len:ranks.length, size:n};
    if (ranks.length >= 2 && by[3].length === ranks.length)
      return {type:"tripseq", rank:hi, len:ranks.length, size:n};
  }

  /* airplanes with attachments */
  if (by[3].length >= 2 && by[4].length === 0){
    var trips = by[3], k = trips.length;
    if (trips[k-1] <= 14 && consecutive(trips)){
      var thi = trips[k-1];
      if (n === 4 * k && !bothJokers && by[1].length + by[2].length * 2 === k)
        return {type:"plane1", rank:thi, len:k, size:n};
      if (n === 5 * k && by[1].length === 0 && by[2].length === k)
        return {type:"plane2", rank:thi, len:k, size:n};
    }
  }
  return null;
}
/* does combo a beat combo b?  b === null means a free lead */
function beats(a, b){
  if (!a) return false;
  if (!b) return true;
  if (a.type === "rocket") return b.type !== "rocket";
  if (b.type === "rocket") return false;
  if (a.type === "bomb" && b.type === "bomb") return a.rank > b.rank;
  if (a.type === "bomb") return true;
  if (b.type === "bomb") return false;
  return a.type === b.type && a.len === b.len && a.size === b.size && a.rank > b.rank;
}

/* ---------------- move generation ---------------- */
function rankGroups(hand){
  var m = new Map(), i, c;
  for (i = 0; i < hand.length; i++){
    c = hand[i];
    if (!m.has(c.rank)) m.set(c.rank, []);
    m.get(c.rank).push(c);
  }
  return m;
}
function runsOf(list, len, cb){
  for (var i = 0; i + len <= list.length; i++){
    var ok = true;
    for (var j = 1; j < len; j++) if (list[i+j] !== list[i+j-1] + 1){ ok = false; break; }
    if (ok) cb(list.slice(i, i + len));
  }
}
/* cheapest k loose cards, max 2 per rank, never both jokers */
function pickSingles(g, ex, k){
  var pool = [];
  g.forEach(function(cs, r){
    if (ex.has(r)) return;
    var take = Math.min(cs.length, 2), i;
    for (i = 0; i < take; i++) pool.push({c:cs[i], r:r, cost:cs.length * 100 + r + i * 0.1});
  });
  pool.sort(function(a,b){ return a.cost - b.cost; });
  var res = [], j16 = false, j17 = false, x;
  for (var i = 0; i < pool.length && res.length < k; i++){
    x = pool[i];
    if (x.r === 16){ if (j17) continue; j16 = true; }
    if (x.r === 17){ if (j16) continue; j17 = true; }
    res.push(x.c);
  }
  return res.length === k ? res : null;
}
/* cheapest k pairs of distinct ranks */
function pickPairs(g, ex, k){
  var pool = [];
  g.forEach(function(cs, r){
    if (ex.has(r) || cs.length < 2 || r >= 16) return;
    pool.push({cs:cs.slice(0,2), cost:cs.length * 100 + r});
  });
  pool.sort(function(a,b){ return a.cost - b.cost; });
  if (pool.length < k) return null;
  var res = [];
  for (var i = 0; i < k; i++) res = res.concat(pool[i].cs);
  return res;
}
/* every reasonable play available from a hand */
function genCandidates(hand){
  var out = [], g = rankGroups(hand);
  var ranks = Array.from(g.keys()).sort(function(a,b){ return a - b; });
  function add(cs){ if (cs && cs.length && parseCombo(cs)) out.push(cs); }

  ranks.forEach(function(r){
    var cs = g.get(r);
    add([cs[0]]);
    if (cs.length >= 2) add(cs.slice(0,2));
    if (cs.length >= 3) add(cs.slice(0,3));
    if (cs.length >= 4) add(cs.slice(0,4));
  });
  if (g.has(16) && g.has(17)) add([g.get(16)[0], g.get(17)[0]]);

  ranks.forEach(function(r){
    var cs = g.get(r), ex = new Set([r]), a;
    if (cs.length >= 3){
      a = pickSingles(g, ex, 1); if (a) add(cs.slice(0,3).concat(a));
      a = pickPairs(g, ex, 1);   if (a) add(cs.slice(0,3).concat(a));
    }
    if (cs.length === 4){
      a = pickSingles(g, ex, 2); if (a) add(cs.slice(0,4).concat(a));
      a = pickPairs(g, ex, 2);   if (a) add(cs.slice(0,4).concat(a));
    }
  });

  var seq1 = ranks.filter(function(r){ return r <= 14; });
  var seq2 = seq1.filter(function(r){ return g.get(r).length >= 2; });
  var seq3 = seq1.filter(function(r){ return g.get(r).length >= 3; });
  var L;
  for (L = 5; L <= 12; L++) runsOf(seq1, L, function(run){
    add(run.map(function(r){ return g.get(r)[0]; }));
  });
  for (L = 3; L <= 10; L++) runsOf(seq2, L, function(run){
    var cs = []; run.forEach(function(r){ cs = cs.concat(g.get(r).slice(0,2)); }); add(cs);
  });
  for (L = 2; L <= 6; L++) runsOf(seq3, L, function(run){
    var core = [];
    run.forEach(function(r){ core = core.concat(g.get(r).slice(0,3)); });
    add(core);
    var ex = new Set(run), a;
    a = pickSingles(g, ex, run.length); if (a) add(core.concat(a));
    a = pickPairs(g, ex, run.length);   if (a) add(core.concat(a));
  });

  if (parseCombo(hand)) out.push(hand.slice());   /* going out in one shot */
  return out;
}

function moveCost(cards, hand){

  for (i = 0; i < cards.length; i++) used.set(cards[i].rank, (used.get(cards[i].rank) || 0) + 1);
  used.forEach(function(n, r){
    var have = g.get(r).length;
    if (n < have) pen += have === 4 ? 30 : (have === 3 ? 6 : 4);
  });
  if (g.has(16) && g.has(17) && (used.has(16) !== used.has(17))) pen += 25;
  var base = cb.rank;
  if (cb.type === "bomb") base += 50;
  if (cb.type === "rocket") base += 80;
  return base + pen - cards.length * 0.8;
}

/* A 20-card landlord hand at the large card size is wider than a laptop window, and

function fitHand(){
  var h = $("#hand"), wrap = $("#handwrap"), n = h.children.length;
  if (!n) return;
  var root = getComputedStyle(document.documentElement);
  var cw    = parseFloat(root.getPropertyValue("--card-w")) || 64;
  var prefOv= parseFloat(root.getPropertyValue("--hand-ov")) || -30;
  var prefVis = cw + prefOv;                       /* visible sliver at your chosen overlap */
  var avail = wrap.clientWidth - 24;               /* leave the wrapper's padding alone */
  var vis = prefVis;
  if (n > 1){
    var fit = (avail - cw) / (n - 1);
    /* seeing every card beats a comfortable sliver, so the fit wins on narrow screens */
    vis = Math.min(prefVis, Math.max(fit, 8));

  /* the opponents always come back with a fresh stack; you choose when to rebuy */

  if (!G.hands[p].length) return later(function(){ endRound(p); }, PACE.beforeResult);
  G.turn = (G.turn + 1) % 3;
  later(turnLoop, PACE.afterPlay);
}
function passTurn(p){
  if (p === G.me) G.myPasses = (G.myPasses || 0) + 1;
  sfxPass();
  G.passes++;
  G.display[p] = "pass";
  log(t("logPassShort", pname(p)));
  render();
  if (p === G.me) setStatus("");
  if (G.passes >= 2){
    G.last = null;
    G.passes = 0;
    G.display = [null,null,null];
    G.turn = (G.turn + 1) % 3;
    later(function(){
      G.display = [null,null,null];
      turnLoop();
    }, PACE.trickEnd);
    return;
  }
  G.turn = (G.turn + 1) % 3;
  later(turnLoop, PACE.afterPass);
}
function doHumanPass(){
  if (G.phase !== "play" || G.turn !== G.me || !G.last) return;
  G.sel.clear(); G.hintList = null;
  localPass();
}
function doHumanPlay(){
  if (G.phase !== "play" || G.turn !== G.me) return;
  var sel = selectedCards();
  var cb = parseCombo(sel);
  if (!cb) return;
  if (G.last && !beats(cb, G.last.combo)) return;
  localPlay(sel);
}
function hint(){
  if (G.phase !== "play" || G.turn !== G.me) return;
  if (!G.hintList){
    var list = G.last ? genBeating(G.hands[G.me], G.last.combo) : genCandidates(G.hands[G.me]);
    var seen = new Set();
    list = list.filter(function(cs){
      var key = cs.map(function(c){ return c.id; }).sort().join(",");
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    list.sort(function(a,b){ return shedScore(a, G.hands[G.me]) - shedScore(b, G.hands[G.me]); });
    G.hintList = list;
    G.hintIdx = 0;
  }
  if (!G.hintList.length){
    setStatus('<div class="big">No legal play</div>you must pass');
    return;
  }
  var pick = G.hintList[G.hintIdx % G.hintList.length];
  G.hintIdx++;
  var keep = G.hintList, idx = G.hintIdx;
  G.sel = new Set(pick.map(function(c){ return c.id; }));
  render();
  G.hintList = keep;
  G.hintIdx = idx;
}

/* Local play routes through these two so online mode can send them over the wire instead. */
function localPlay(cards){
  if (G.mode === "guest"){
    netSend({t:"act", kind:"play", ids: cards.map(function(c){ return c.id; })});
    G.sel.clear(); G.hintList = null; render();
    return;
  }
  playCards(G.me, cards);
}
function localPass(){
  if (G.mode === "guest"){ netSend({t:"act", kind:"pass"}); render(); return; }
  passTurn(G.me);
}
function localBid(v){
  if (G.mode === "guest"){ netSend({t:"act", kind:"bid", v:v}); return; }
  applyBid(G.me, v);
}

/* ---------------- scoring ---------------- */
function endRound(winner){
  G.phase = "over";
  var landlordWon = winner === G.landlord;
  var springTxt = "";
  var mult = G.multiplier;
  var peas = [0,1,2].filter(function(i){ return i !== G.landlord; });
  if (landlordWon && G.plays[peas[0]] === 0 && G.plays[peas[1]] === 0){
    mult *= 2; springTxt = t("spring");
  }
  if (!landlordWon && G.plays[G.landlord] === 1){
    mult *= 2; springTxt = t("antiSpring");
  }
  var pts  = G.bid * mult;                 /* the score in points … */
  var unit = pts * G.handBase;             /* … converted to chips, per opponent */
  var delta = [0,0,0], i;

  /* table stakes: nobody can pay more than they actually have in front of them */
  var capped = false;
  if (landlordWon){
    peas.forEach(function(k){
      var pay = Math.min(unit, G.chips[k]);
      if (pay < unit) capped = true;
      delta[k] -= pay;
      delta[G.landlord] += pay;
    });
  } else {
    var owed = Math.min(2 * unit, G.chips[G.landlord]);
    if (owed < 2 * unit) capped = true;
    var each = Math.floor(owed / 2), odd = owed - each * 2;
    peas.forEach(function(k, n){
      var get = each + (n === 0 ? odd : 0);
      delta[k] += get;
      delta[G.landlord] -= get;
    });
  }
  for (i = 0; i < 3; i++) G.chips[i] += delta[i];
  saveBank();

  log(t("logOut", pname(winner), landlordWon ? t("llWins") : t("peaWins"), fmt(unit)));
  render();

  var result = {
    winner:winner, landlord:G.landlord, bid:G.bid, multiplier:G.multiplier,
    springTxt:springTxt, pts:pts, unit:unit, capped:capped,
    delta:delta, chips:G.chips.slice(), handBase:G.handBase
  };
  if (G.mode === "host") netSend({t:"result", result:result});
  showResult(result);
  setStatus("");
}

/* ======================= online play =======================
   The server is a dumb relay. Whoever opens the table is the dealer: they run the
   rules and send each player only their own cards, so no hand is ever transmitted
   to somebody who should not see it. Empty seats are played by bots. */
/* ======================= the wire =======================
   Everything above this line talks in messages — join / seated / act / view /
   result — and does not care how they travel. Two carriers implement that:

     relay     the bundled server.js, for a table on your own machine
     supabase  Realtime broadcast, so a table works with no server at all

   Adding a carrier means implementing create/connect/send/leave, nothing more. */
var NET = {room:null, pid:null, es:null, hostPid:null, seatPid:[null,null,null], urls:[], wire:null};

/* Fill these in to play over the internet with no server of your own. Both values
   come from your Supabase project's Settings → API. The anon key is meant to live
   in client code; the service_role key must never appear here. */
var SUPABASE_URL = "https://talisstwpkvjxqmhgffp.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_M_2ulkT4TYW28zQPFV_ewg_OuPYdBBQ";
function supabaseConfigured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }

function netId(){ return Math.random().toString(36).slice(2, 10); }
function tableCode(){
  var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = "", i;   /* no I/O/0/1 */
  for (i = 0; i < 5; i++) c += A[Math.floor(Math.random() * A.length)];
  return c;
}
function netPost(url, body){
  return fetch(url, {method:"POST", headers:{"content-type":"application/json"},
                     body:JSON.stringify(body)}).then(function(r){ return r.json(); });
}

/* ---- carrier: the bundled relay server ---- */
var relayWire = {
  name: "relay",
  create: function(){
    return netPost("/r/new", {}).then(function(r){
      NET.urls = r.urls || [];
      return r.room;
    });
  },
  connect: function(room, onMsg){
    NET.room = room;
    NET.pid  = netId();
    NET.es   = new EventSource("/r/sub?room=" + encodeURIComponent(room) + "&pid=" + NET.pid);
    NET.es.onmessage = function(e){
      var env;
      try { env = JSON.parse(e.data); } catch(err){ return; }
      if (env && env.msg) onMsg(env.msg, env.from);
    };
    NET.es.onerror = function(){ /* EventSource retries by itself */ };
    return Promise.resolve();
  },
  send: function(msg, to){
    netPost("/r/pub", {room:NET.room, from:NET.pid, to:to || null, msg:msg})["catch"](function(){});
  },
  leave: function(){
    if (NET.es){ try { NET.es.close(); } catch(e){} }
    NET.es = null;
  }
};

/* ---- carrier: Supabase Realtime ----
   The client is fetched only when somebody actually opens a table, so playing the
   bots stays a single file with no network at all.

   Messages addressed to one player go on that player's own channel rather than the
   table channel, because a broadcast reaches every subscriber — otherwise a curious
   player could read the hands dealt to everyone else. That is obscurity, not
   security: the dealer is trusted in this design. Realtime Authorization would make
   it enforceable, and needs no game data in the database. */
var SB_CDN = "https://esm.sh/@supabase/supabase-js@2";
var sb = {client:null, table:null, mine:null, lobby:null, loading:null};

function sbClient(){
  if (sb.client) return Promise.resolve(sb.client);

    sb.client = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {persistSession:false},
      realtime: {params:{eventsPerSecond:20}}
    });
    /* No sign-in: broadcast and presence work on the publishable key alone, and
       nothing is stored against a user anyway. */
    return sb.client;
  });
  return sb.loading;
}

      if (!sb.table) return;
      var st = {};
      try { st = sb.table.presenceState() || {}; } catch(e){}
      if (!st[NET.pid]) sbTrack(attempt + 1);
    }, 1200);
  }
}
function sbSubscribed(ch){
  return new Promise(function(resolve, reject){
    ch.subscribe(function(status){
      if (status === "SUBSCRIBED") resolve(ch);
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") reject(new Error(status));
    });
  });
}
var supabaseWire = {
  name: "supabase",
  create: function(){
    NET.urls = [location.origin];          /* the share link is this page */
    return Promise.resolve(tableCode());
  },
  connect: function(room, onMsg){
    NET.room = room;
    NET.pid  = netId();
    return sbClient().then(function(c){
      /* everyone at the table hears this one */
      sb.table = c.channel("ddz:t:" + room, {config:{broadcast:{self:false}, presence:{key:NET.pid}}});
      sb.table.on("broadcast", {event:"msg"}, function(p){
        if (p && p.payload && p.payload.msg) onMsg(p.payload.msg, p.payload.from);
      });
      /* presence replaces the relay's join/leave bookkeeping for free */
      sb.table.on("presence", {event:"join"}, function(e){
        (e.newPresences || []).forEach(function(pr){
          if (pr.pid && pr.pid !== NET.pid) onMsg({t:"peer-joined", pid:pr.pid}, pr.pid);
        });
      });
      sb.table.on("presence", {event:"leave"}, function(e){
        (e.leftPresences || []).forEach(function(pr){
          if (pr.pid) onMsg({t:"peer-left", pid:pr.pid}, pr.pid);
        });
      });
      /* and this one is just for us */
      sb.mine = c.channel("ddz:p:" + NET.pid, {config:{broadcast:{self:false}}});
      sb.mine.on("broadcast", {event:"msg"}, function(p){
        if (p && p.payload && p.payload.msg) onMsg(p.payload.msg, p.payload.from);
      });
      return Promise.all([sbSubscribed(sb.table), sbSubscribed(sb.mine)]);
    }).then(function(){
      /* Presence is a convenience, not part of the handshake. Gating the greeting on
         it meant one failed track() left a player sitting in the lobby for ever. */
      sbTrack(0);
      onMsg({t:"hello", pid:NET.pid, room:room}, "server");
    });
  },
  send: function(msg, to){
    var env = {type:"broadcast", event:"msg", payload:{from:NET.pid, msg:msg}};
    if (to){
      if (!sb.client) return;
      sb.client.channel("ddz:p:" + to, {config:{broadcast:{self:false}}}).send(env);
      return;
    }
    if (sb.table) sb.table.send(env);
  },
  leave: function(){
    [sb.table, sb.mine, sb.lobby].forEach(function(ch){
      if (ch && sb.client){ try { sb.client.removeChannel(ch); } catch(e){} }
    });
    sb.table = sb.mine = sb.lobby = null;
  }
};

function pickWire(){ return supabaseConfigured() ? supabaseWire : relayWire; }
function netSend(msg, to){
  if (!NET.room || !NET.wire) return;
  NET.wire.send(msg, to);
}
function netConnect(room, onMsg){
  NET.wire = NET.wire || pickWire();
  return NET.wire.connect(room, onMsg);
}

function buildView(p){

    multiplier:G.multiplier, bombs:G.bombs, handBase:G.handBase, base:G.base,

    counts:[G.hands[0].length, G.hands[1].length, G.hands[2].length],
    hand:G.hands[p],                                   /* only ever this player's own cards */
    last:G.last ? {cards:G.last.cards, player:G.last.player} : null,
    display:G.display.map(function(d){ return d === "pass" ? "pass" : null; }),
    auction:G.auction ? {high:G.auction.high} : null

}
function applyView(v){
  if (v.phase === "auction" && G.phase === "idle") boardSig = handSig = null;
  G.me = v.me; G.phase = v.phase; G.turn = v.turn; G.landlord = v.landlord;

  G.handBase = v.handBase; G.base = v.base;
  G.chips = v.chips; G.names = v.names; G.humans = v.humans;
  G.kitty = new Array(v.kitty);
  G.hands = [0,1,2].map(function(i){ return i === v.me ? v.hand : new Array(v.counts[i]); });
  G.last = v.last ? {cards:v.last.cards, player:v.last.player, combo:parseCombo(v.last.cards)} : null;
  G.display = v.display;
  G.auction = v.auction ? {high:v.auction.high, highBidder:-1, passes:0, seen:0} : null;
  hideHome();
  hideModal();
  render();
  if (G.phase === "play" || G.phase === "auction"){
    if (G.turn === G.me){
      setStatus(G.phase === "auction"
        ? '<div class="big">Your bid</div>' + (v.auction && v.auction.high ? "highest bid " + v.auction.high : "no bids yet")
        : '<div class="big">Your turn</div>' + (G.last ? "beat the " + comboName(G.last.combo.type).replace(/^\S+\s/,"") : "you lead"));
    } else {
      setStatus('<div class="big">' + pname(G.turn) + "</div>" + (G.phase === "auction" ? "bidding…" : "playing…"));

var bcPending = null;
function broadcastViews(){
  if (G.mode !== "host") return;
  bcPending = null;
  for (var p = 0; p < 3; p++){
    var pid = NET.seatPid[p];
    if (pid && pid !== NET.pid) netSend(buildView(p), pid);
  }
}

/* ---- the dealer validates every move it is sent ---- */
function hostHandleAct(seat, a){
  if (seat < 0) return;
  if (a.kind === "bid"){
    if (G.phase === "auction" && G.turn === seat) applyBid(seat, a.v);
    return;
  }
  if (G.phase !== "play" || G.turn !== seat) return;
  if (a.kind === "pass"){ if (G.last) passTurn(seat); return; }
  var ids = a.ids || [], hand = G.hands[seat];
  var cards = hand.filter(function(c){ return ids.indexOf(c.id) >= 0; });
  if (!cards.length || cards.length !== ids.length) return;      /* not their cards */
  var cb = parseCombo(cards);
  if (!cb) return;                                               /* not a legal shape */
  if (G.last && !beats(cb, G.last.combo)) return;                /* does not beat */
  playCards(seat, cards);
}
function seatOfPid(pid){
  for (var i = 0; i < 3; i++) if (NET.seatPid[i] === pid) return i;
  return -1;
}
function hostOnMsg(msg, from){
  if (msg.t === "hello"){ NET.hostPid = NET.pid; renderLobby(); return; }
  if (msg.t === "join"){
    var seat = seatOfPid(from);
    if (seat < 0){
      seat = NET.seatPid.indexOf(null, 1);
      if (seat < 1) { netSend({t:"full"}, from); return; }
      NET.seatPid[seat] = from;
      G.humans[seat] = true;
      G.names[seat] = (msg.name || "Player").slice(0, 12);
    }
    netSend({t:"seated", seat:seat, room:NET.room, hostPid:NET.pid, names:G.names}, from);
    renderLobby();
    if (G.phase !== "idle") broadcastViews();
    return;
  }
  if (msg.t === "act"){ hostHandleAct(seatOfPid(from), msg); return; }
  if (msg.t === "peer-left"){
    var s2 = seatOfPid(msg.pid);
    if (s2 > 0){
      NET.seatPid[s2] = null;
      G.humans[s2] = false;
      G.names[s2] = null;
      log(t("logLeft", pname(s2)));
      renderLobby();
      render();
      if ((G.phase === "play" || G.phase === "auction") && G.turn === s2){
        G.phase === "auction" ? nextBid() : turnLoop();
      }
    }
    return;
  }
}
function guestOnMsg(msg, from){
  if (msg.t === "hello"){ guestKnock(0); return; }
  if (msg.t === "seated"){
    G.me = msg.seat; G.names = msg.names; NET.hostPid = msg.hostPid;
    renderLobby();
    return;
  }
  if (msg.t === "full"){ showNotice(t("fullT"), t("fullB")); return; }
  if (msg.t === "view"){ applyView(msg); return; }
  if (msg.t === "result"){ showResult(msg.result); return; }
  if (msg.t === "lobby"){ G.names = msg.names; renderLobby(); return; }
  if (msg.t === "peer-left" && msg.pid === NET.hostPid){
    showNotice(t("closedT"), t("closedB"));
  }
}

  if (G.mode !== "guest" || NET.hostPid) return;      /* seated, or no longer a guest */

  if (n < 6) setTimeout(function(){ guestKnock(n + 1); }, 2000);
}

/* ======================= music =======================
   Synthesised in the browser — the game is one self-contained file, so there is no
   audio to download. Two looping pentatonic themes: a calm one for the menu and a
   faster one at the table. Browsers refuse to make noise before you interact with
   the page, so the audio engine is built on your first click and not before. */
function expandSeq(seq, total){
  var out = [], i;
  for (i = 0; i < total; i++) out.push(0);
  i = 0;
  seq.forEach(function(pair){
    if (i < total) out[i] = pair[0];
    i += pair[1];
  });
  return out;
}
var TRACKS = {

    ring:5.6, bassRing:15, arpGain:0.05,

    arp: expandSeq([[72,2],[76,2],[79,2],[76,2],[72,2],[76,2],[79,2],[76,2],
                    [69,2],[72,2],[76,2],[72,2],[69,2],[72,2],[76,2],[72,2],
                    [67,2],[74,2],[79,2],[74,2],[67,2],[74,2],[79,2],[74,2],
                    [72,2],[76,2],[79,2],[76,2],[72,2],[76,2],[79,2],[76,2]], 64),
    mel: expandSeq([[76,4],[79,4],[81,4],[79,4],
                    [76,4],[74,4],[72,8],
                    [74,4],[76,4],[79,4],[76,4],
                    [74,4],[72,12]], 64),
    bass: expandSeq([[48,16],[45,16],[43,16],[48,16]], 64)
  },
  play: {

                    [76,2],[79,2],[81,2],[79,2],[76,2],[74,2],[72,4],
                    [74,2],[76,2],[79,2],[81,2],[84,2],[81,2],[79,4]], 64),
    bass: expandSeq([[48,8],[48,8],[43,8],[43,8],[45,8],[45,8],[43,8],[48,8]], 64)
  }
};
var MUSIC = {ctx:null, master:null, sfx:null, timer:null, track:null, want:null, step:0, nextAt:0, noise:null};
function hz(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

function audioBoot(){
  if (MUSIC.ctx) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try {
    MUSIC.ctx = new AC();
    MUSIC.master = MUSIC.ctx.createGain();          /* music bus */
    MUSIC.master.gain.value = 0.0001;
    MUSIC.sfx = MUSIC.ctx.createGain();             /* effects bus, independent of music */
    MUSIC.sfx.gain.value = 0.9;
    var comp = MUSIC.ctx.createDynamicsCompressor();
    MUSIC.master.connect(comp);
    MUSIC.sfx.connect(comp);
    comp.connect(MUSIC.ctx.destination);
    /* a little noise buffer for the hats */
    var n = MUSIC.ctx.sampleRate * 0.2, buf = MUSIC.ctx.createBuffer(1, n, MUSIC.ctx.sampleRate);
    var d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    MUSIC.noise = buf;
  } catch(e){ MUSIC.ctx = null; return false; }
  return true;
}
function pluck(at, freq, dur, wave, peak){
  var c = MUSIC.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = wave; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(MUSIC.master);
  o.start(at); o.stop(at + dur + 0.02);
}
function bassNote(at, freq, dur){
  var c = MUSIC.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = "triangle"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.value = 620;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.16, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(MUSIC.master);
  o.start(at); o.stop(at + dur + 0.02);
}
function hat(at, peak){

  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);

/* ---------------- sound effects ----------------

   music off does not silence them. */
function sfxReady(){
  if (!PREFS.sfx) return false;

  if (MUSIC.ctx.state === "suspended" && MUSIC.ctx.resume) MUSIC.ctx.resume();

function tone(at, f0, f1, dur, type, peak, dest){
  var c = MUSIC.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, at);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(dest || MUSIC.sfx);
  o.start(at); o.stop(at + dur + 0.02);

function noiseBurst(at, dur, peak, filtType, f0, f1, dest){
  var c = MUSIC.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  src.buffer = MUSIC.noise; src.loop = true;
  f.type = filtType;
  f.frequency.setValueAtTime(f0, at);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(peak, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  src.connect(f); f.connect(g); g.connect(dest || MUSIC.sfx);

/* a card leaving the hand: a paper flick plus a small bright blip that opens up
   as the combination gets bigger */
function sfxCard(n, dest){
  if (!dest && !sfxReady()) return;
  var at = (dest ? 0 : MUSIC.ctx.currentTime) + 0.001;
  noiseBurst(at, 0.07, 0.05, "bandpass", 2600, 1200, dest);

  if (!dest && !sfxReady()) return;
  var at = (dest ? 0 : MUSIC.ctx.currentTime) + 0.001;
  tone(at,        320, 300, 0.09, "sine", 0.07, dest);
  tone(at + 0.07, 240, 210, 0.12, "sine", 0.06, dest);

/* a bomb: low body drop under a filtered blast */
function sfxBomb(dest){
  if (!dest && !sfxReady()) return;
  var at = (dest ? 0 : MUSIC.ctx.currentTime) + 0.001;
  noiseBurst(at, 0.42, 0.22, "lowpass", 3200, 180, dest);

/* the rocket outranks everything, so it gets a launch: a rising whoosh into a burst */

  if (!dest && !sfxReady()) return;
  var at = (dest ? 0 : MUSIC.ctx.currentTime) + 0.001;
  noiseBurst(at, 0.30, 0.10, "bandpass", 400, 2600, dest);
  tone(at, 300, 1500, 0.30, "sawtooth", 0.09, dest);
  noiseBurst(at + 0.30, 0.34, 0.20, "lowpass", 4000, 300, dest);

function musicTick(){
  var T = TRACKS[MUSIC.track];
  if (!T || !MUSIC.ctx) return;
  var stepDur = 60 / T.bpm / 4;                 /* sixteenth notes */
  while (MUSIC.nextAt < MUSIC.ctx.currentTime + 0.18){
    var s = MUSIC.step % T.steps, at = MUSIC.nextAt;
    if (T.mel[s])  pluck(at, hz(T.mel[s]), stepDur * (T.ring || 3.4), T.wave, T.lead);
    if (T.arp && T.arp[s]) pluck(at, hz(T.arp[s]), stepDur * 2.2, "sine", T.arpGain);
    if (T.bass[s]) bassNote(at, hz(T.bass[s] - 12), stepDur * (T.bassRing || 6));
    if (T.perc && s % 2 === 0) hat(at, s % 8 === 0 ? 0.05 : 0.022);

    MUSIC.nextAt += stepDur;

function musicSet(track){
  MUSIC.want = track;
  if (!PREFS.music || !MUSIC.ctx) return;
  if (MUSIC.track === track) return;
  MUSIC.track = track;
  MUSIC.step = 0;
  MUSIC.nextAt = MUSIC.ctx.currentTime + 0.06;
  if (!MUSIC.timer) MUSIC.timer = setInterval(musicTick, 25);
  MUSIC.master.gain.cancelScheduledValues(MUSIC.ctx.currentTime);
  MUSIC.master.gain.setValueAtTime(Math.max(MUSIC.master.gain.value, 0.0001), MUSIC.ctx.currentTime);

}
function musicStop(){
  if (MUSIC.ctx && MUSIC.master){
    MUSIC.master.gain.cancelScheduledValues(MUSIC.ctx.currentTime);
    MUSIC.master.gain.setValueAtTime(MUSIC.master.gain.value, MUSIC.ctx.currentTime);
    MUSIC.master.gain.exponentialRampToValueAtTime(0.0001, MUSIC.ctx.currentTime + 0.35);
  }
  if (MUSIC.timer){ clearInterval(MUSIC.timer); MUSIC.timer = null; }
  MUSIC.track = null;
}
function musicToggle(){
  PREFS.music = !PREFS.music;
  savePrefs();
  if (PREFS.music){ if (audioBoot()) { MUSIC.ctx.resume && MUSIC.ctx.resume(); musicSet(MUSIC.want || "menu"); } }

}
function renderMute(){
  var b = $("#btnmute");
  if (!b) return;
  b.textContent = PREFS.music ? "🔊" : "🔇";
  b.title = t("setMusic");
}
/* browsers only allow audio after a real interaction */
function unlockAudio(){
  if (!PREFS.music && !PREFS.sfx) return;
  if (!audioBoot()) return;
  if (MUSIC.ctx.state === "suspended" && MUSIC.ctx.resume) MUSIC.ctx.resume();
  if (PREFS.music) musicSet(MUSIC.want || "menu");
}

  sky_high:["Por las nubes","Gana una mano que valga dieciséis veces la puja o más."],
  all_in:["A por todas","Gana una mano que pujaste a tres."],
  rev_spring:["Primavera inversa","Gana como campesino con el terrateniente jugando una sola vez."],
  encyclopedia:["Enciclopedia","Juega cada tipo de combinación al menos una vez."],
  clean_hands:["Manos limpias","Gana una mano sin jugar bomba ni cohete."],
  blitz:["Relámpago","Gana una mano en cinco jugadas o menos."],
  split_kings:["Comodines sueltos","Juega los dos comodines por separado en una mano."],
  bigger_bang:["Más pólvora","Supera la bomba de otro con una mayor."],
  high_roller:["A lo grande","Gana una mano a la apuesta más alta."],
  rock_bottom:["Tocar fondo","Piérdelo todo y vuelve a entrar."],
  hands500:["Devoto","Juega quinientas manos."],
  wins200:["Maestro","Gana doscientas manos."],
  bank10000:["Magnate","Haz crecer tu banca hasta 10.000 fichas."]
}
};
function achText(id){
  var pack = ACH_TXT[LANG] || ACH_TXT.en;
  return pack[id] || ACH_TXT.en[id] || [id, ""];
}
var ACHS = {done:{}, prog:{}, streak:0, best:0, langs:{}, types:{}};
try {
  var savedAch = JSON.parse(localStorage.getItem("ddz-ach") || "null");
  if (savedAch){
    ACHS.done = savedAch.done || {};
    ACHS.prog = savedAch.prog || {};
    ACHS.streak = savedAch.streak || 0;
    ACHS.langs = savedAch.langs || {};
    ACHS.types = savedAch.types || {};
    ACHS.best = savedAch.best || 0;
  }
} catch(e){}
function achSave(){
  try { localStorage.setItem("ddz-ach", JSON.stringify(ACHS)); } catch(e){}
}
function achDef(id){
  for (var i = 0; i < ACH.length; i++) if (ACH[i].id === id) return ACH[i];
  return null;
}
/* raise a counter; unlock the moment it reaches the goal */
function achBump(id, n){
  if (ACHS.done[id]) return;
  var def = achDef(id);
  if (!def) return;
  ACHS.prog[id] = Math.max(ACHS.prog[id] || 0, 0) + (n === undefined ? 1 : n);
  if (ACHS.prog[id] >= def.goal){
    ACHS.done[id] = true;
    achToast(id);
  }
  achSave();
}
/* set a counter outright (used by streaks, which can go down as well as up) */
function achSet(id, value){
  var def = achDef(id);
  if (!def) return;
  ACHS.prog[id] = Math.max(ACHS.prog[id] || 0, value);
  if (!ACHS.done[id] && value >= def.goal){
    ACHS.done[id] = true;
    achToast(id);
  }
  achSave();
}
/* how many distinct languages this player has actually played in */
function achLang(id){
  if (!ACHS.langs) ACHS.langs = {};
  if (!ACHS.langs[id]){
    ACHS.langs[id] = 1;
    achSet("polyglot", Object.keys(ACHS.langs).length);
    achSave();
  }
}
var toastQueue = [];
function achToast(id){
  toastQueue.push(id);
  if (toastQueue.length === 1) toastNext();
}
function toastNext(){
  if (!toastQueue.length) return;
  var id = toastQueue[0], def = achDef(id), txt = achText(id);
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="ti">' + def.icon + "</span><span><b>" + t("achGot") +
                 "</b><br>" + txt[0] + "</span>";
  $("#toasts").appendChild(el);
  sfxAchievement();
  setTimeout(function(){ el.classList.add("out"); }, 3200);
  setTimeout(function(){
    el.remove();
    toastQueue.shift();
    toastNext();
  }, 3700);
}
function sfxAchievement(){
  if (!sfxReady()) return;
  var at = MUSIC.ctx.currentTime + 0.001;
  tone(at,        784, 784, 0.12, "triangle", 0.09);
  tone(at + 0.10, 988, 988, 0.12, "triangle", 0.09);
  tone(at + 0.20, 1319, 1319, 0.22, "triangle", 0.10);
}
/* watch our own plays for the combination-based ones */
function achOnPlay(cb, cards){
  if (cb.type === "straight"){
    if (cb.len >= 8)  achBump("long_run");
    if (cb.len >= 11) achBump("great_wall");
  }
  if (cb.type === "straight" && cb.len >= 12) achBump("full_run");
  if (cb.type === "pairseq" && cb.len >= 5) achBump("pair_run");
  /* every distinct kind of combination we have ever played */
  if (!ACHS.types) ACHS.types = {};
  if (!ACHS.types[cb.type]){
    ACHS.types[cb.type] = 1;
    achSet("encyclopedia", Object.keys(ACHS.types).length);
  }
  /* both jokers played separately rather than as the rocket */
  if (cb.type === "single" && cards[0].rank >= 16){
    G.myJokers = G.myJokers || {};
    G.myJokers[cards[0].rank] = 1;
    if (Object.keys(G.myJokers).length >= 2) achBump("split_kings");
  }
  if ((cb.type === "tripseq" || cb.type === "plane1" || cb.type === "plane2") && cb.len >= 3)
    achBump("squadron");
  if (cb.type === "quad1")  achBump("quad_two");
  if (cb.type === "quad2")  achBump("quadplex");
  if (cb.type === "plane2") achBump("airplane");
  if (cb.type === "rocket"){
    achBump("rocket");
    G.myRocket = true;
    if (G.myBombs) achBump("arsenal");
  }
  if (cb.type === "bomb"){
    G.myBombs = (G.myBombs || 0) + 1;
    if (G.myBombs >= 3) achBump("three_bombs");
    if (G.myBombs >= 5) achBump("scorched");
    if (G.myRocket) achBump("arsenal");
    if (G.prevCombo && G.prevCombo.type === "bomb") achBump("bigger_bang");
  }
  /* the cards are already gone by the time we get here, so an empty hand means
     this play was the one that finished the deal */
  if (!G.hands[G.me].length){
    if (cb.type === "bomb")   achBump("bang");
    if (cb.type === "rocket") achBump("star_finish");
    if (cards.length >= 8)    achBump("big_finish");
  }
}
/* and the result for everything else */
function achOnResult(r, youWon){
  if (youWon){
    ACHS.streak++;
    ACHS.best = Math.max(ACHS.best, ACHS.streak);
    achBump("first_win");
    achBump("wins50");
    achBump("wins200");
    achSet("streak3", ACHS.streak);
    achSet("streak6", ACHS.streak);
    achSet("streak10", ACHS.streak);
    if (r.landlord === G.me) achBump("landlord10"); else achBump("peasant10");
    if (r.springTxt) achBump("spring");
    if (r.springTxt && r.landlord !== G.me) achBump("rev_spring");
    if (r.multiplier >= 16) achBump("sky_high");
    if (r.bid === 3) achBump("all_in");
    if (r.handBase >= 100) achBump("high_roller");
    if (!G.myBombs && !G.myRocket) achBump("clean_hands");
    if (G.plays[G.me] <= 5) achBump("blitz");
    if (r.delta[G.me] >= 500) achBump("big_pot");
    if (!G.myPasses) achBump("relentless");
    if (G.chipsAtDeal !== undefined && G.chipsAtDeal <= 200) achBump("comeback");
    if (PREFS.diff === "hard" && G.mode === "ai") achBump("hard_win");
    if (PREFS.diff === "impossible" && G.mode === "ai") achBump("imp_win");
  } else {
    ACHS.streak = 0;
    if (r.delta[G.me] <= -500) achBump("tuition");
  }
  if (G.chips[G.me] >= 5000) achBump("bank5000");
  if (G.chips[G.me] >= 10000) achBump("bank10000");
  achSave();
}
function showAchievements(){
  var done = 0;
  ACH.forEach(function(a){ if (ACHS.done[a.id]) done++; });
  var rows = ACH.map(function(a){
    var txt = achText(a.id), got = !!ACHS.done[a.id];
    var prog = Math.min(ACHS.prog[a.id] || 0, a.goal);
    var meter = (a.goal > 1 && !got) ? '<span class="apr">' + prog + "/" + a.goal + "</span>" : "";
    return '<li class="' + (got ? "got" : "") + '"><span class="ai">' + (got ? a.icon : "🔒") +
      '</span><span class="atx"><b>' + txt[0] + "</b><br><span>" + txt[1] + "</span></span>" + meter + "</li>";
  }).join("");
  showModal(
    "<h2>" + t("achievements") + "</h2>" +
    '<div class="sub">' + t("achCount", done, ACH.length) +
      (ACHS.best ? " · " + t("achBest", ACHS.best) : "") + "</div>" +
    '<ul class="achlist">' + rows + "</ul>" +
    '<div class="row"><button class="gold" id="achclose">' + t("gotIt") + "</button></div>",
    function(){
      $("#achclose").addEventListener("click", function(){
        hideModal();
        if ($("#home").classList.contains("hidden")) showHome();
      });
    }
  );
}

function showHome(){
  G.epoch++;                       /* stop any hand still running behind the menu */
  G.phase = "idle";
  $("#homeBank").innerHTML = t("yourBank", fmt(G.chips[G.me]));
  $("#home").classList.remove("hidden");
  musicSet("menu");
}
function hideHome(){ $("#home").classList.add("hidden"); }
function startVsAi(){
  hideHome();
  netLeave();                       /* a stale table must not reach into a solo game */
  G.mode = "ai"; G.me = 0;
  G.humans = [true, false, false];
  G.names = [null, null, null];
  newRound();
}
$("#modeAi").addEventListener("click", startVsAi);
$("#modeOnline").addEventListener("click", showOnlineSetup);
$("#homeAch").addEventListener("click", showAchievements);
$("#homeSettings").addEventListener("click", showSettings);
$("#homeRules").addEventListener("click", function(){
  showModal(rulesHtml(), function(){ $("#mclose").addEventListener("click", hideModal); });
});
$("#btnmute").addEventListener("click", musicToggle);
$("#btnrules").addEventListener("click", function(){
  showModal(rulesHtml(), function(){ $("#mclose").addEventListener("click", hideModal); });
});
$("#btnnew").addEventListener("click", function(){
  if (G.mode === "guest") return;             /* only the dealer starts hands */
  if (G.phase === "idle") return;
  hideModal(); newRound();
});
$("#btnexit").addEventListener("click", function(){
  netLeave(); hideModal(); showHome();
});
window.addEventListener("resize", function(){ fitHand(); });
/* ---------------------------------------------------------------------------
   Click rescue.

   Three separate reports of dialogs and the menu not responding, none of which
   reproduce here — so rather than keep guessing which layer is at fault, this
   catches the click at the document before anything can swallow it, looks at the
   whole stack of elements under the pointer, and presses the button that is
   actually there. If some invisible layer is covering a button, the button still
   works. A click that already landed on a button is left completely alone.
   --------------------------------------------------------------------------- */
var rescuing = false;
document.addEventListener("click", function(e){
  if (rescuing) return;
  var overlayOpen = !$("#overlay").classList.contains("hidden");
  var homeOpen    = !$("#home").classList.contains("hidden");
  if (!overlayOpen && !homeOpen) return;
  var t = e.target;
  if (t && t.closest && t.closest("button")) return;      /* landed properly — nothing to do */
  if (!document.elementsFromPoint) return;
  var stack = document.elementsFromPoint(e.clientX, e.clientY), i, el;
  for (i = 0; i < stack.length; i++){
    el = stack[i];
    if (el.tagName === "BUTTON" && el.closest && (el.closest("#modal") || el.closest("#home"))){
      rescuing = true;
      try { el.click(); } finally { rescuing = false; }
      return;
    }
  }
}, true);

/* The menu answers the keyboard as well, so there is always a way in. */
document.addEventListener("keydown", function(e){
  if ($("#home").classList.contains("hidden")) return;
  if (!$("#overlay").classList.contains("hidden")) return;   /* a dialog owns the keys */
  var k = e.key.toLowerCase();
  var hit = k === "1" ? "modeAi" : k === "2" ? "modeOnline"
          : k === "a" ? "homeAch" : k === "s" ? "homeSettings"
          : (k === "r" || k === "h") ? "homeRules" : null;
  if (hit){ e.preventDefault(); $("#" + hit).click(); }
}, true);

/* Dialogs answer the keyboard too, so a stuck pointer can never trap you in one. */
document.addEventListener("keydown", function(e){
  if ($("#overlay").classList.contains("hidden")) return;
  var primary = document.querySelector("#modal button.gold");
  var secondary = document.querySelector("#modal .row button.ghost");
  if (e.key === "Enter" && primary){ e.preventDefault(); e.stopPropagation(); primary.click(); }
  else if (e.key === "Escape"){
    e.preventDefault(); e.stopPropagation();
    (secondary || primary || {click:function(){}}).click();
  }
}, true);
document.addEventListener("keydown", function(e){
  if (!$("#overlay").classList.contains("hidden")) return;   /* a dialog owns the keys */
  if (G.phase !== "play" || G.turn !== G.me) return;
  if (e.key === "Enter"){ e.preventDefault(); doHumanPlay(); }
  if (e.key === " "){ e.preventDefault(); doHumanPass(); }
  if (e.key === "h" || e.key === "H"){ e.preventDefault(); hint(); }
});
(function(){
  var code = new URLSearchParams(location.search).get("table");
  if (code && location.protocol !== "file:") joinTable(code.toUpperCase());
  else showHome();
})();
